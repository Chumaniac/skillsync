name: SkillSync Docker Reference Runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build the local reference image
        run: docker build --pull=false --network=none -f runner/reference/Dockerfile -t skillsync/reference:ci .
      - name: Bind the smoke test to the local image id
        id: image
        run: echo "id=$(docker image inspect --format '{{.Id}}' skillsync/reference:ci)" >> "$GITHUB_OUTPUT"
      - name: Validate the image contract
        run: |
          docker image inspect --format '{{json .Config}}' "${{ steps.image.outputs.id }}" \
            > "$RUNNER_TEMP/skillsync-reference-config.json"
          node dist/cli/index.js runner validate --config "$RUNNER_TEMP/skillsync-reference-config.json"
      - name: Run the explicit Docker smoke test
        env:
          SKILLSYNC_DOCKER_INTEGRATION: "1"
          SKILLSYNC_REFERENCE_IMAGE: ${{ steps.image.outputs.id }}
        run: npm test -- tests/integration/docker-reference.test.ts
