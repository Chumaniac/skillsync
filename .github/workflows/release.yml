name: SkillSync Release Validation

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - name: Run the offline test suite
        run: npm test
      - name: Type-check the release candidate
        run: npm run type-check
      - name: Lint the release candidate
        run: npm run lint
      - name: Build the release candidate
        run: npm run build
      - name: Inspect the public package contents
        run: npm pack --dry-run
      - name: Publish the package with npm provenance
        run: npm publish --provenance --access public
