name: SkillSync GitHub Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Bind the immutable tag to an already verified main source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          refs=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" "refs/tags/$GITHUB_REF_NAME^{}")
          commit=$(printf '%s\n' "$refs" | awk '/\^\{\}$/ {print $1;exit}')
          [[ -n "$commit" ]] || commit=$(printf '%s\n' "$refs" | awk 'NR==1 {print $1}')
          test "$commit" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/skillsync.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=success&per_page=1" > "$RUNNER_TEMP/source-ci.json"
          node --input-type=module - "$RUNNER_TEMP/source-ci.json" <<'JS'
          import fs from 'node:fs';
          const runs=JSON.parse(fs.readFileSync(process.argv[2],'utf8')).workflow_runs;
          if (!runs.some(run=>run.head_sha===process.env.GITHUB_SHA&&run.head_branch==='main'&&run.conclusion==='success')) process.exit(1);
          JS
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'An existing release must not be overwritten' >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
      - name: Assemble actual package and validated metadata
        run: |
          set -euo pipefail
          mkdir release
          npm pack --json --ignore-scripts --pack-destination release > "$RUNNER_TEMP/package.json"
          npm sbom --sbom-format cyclonedx --package-lock-only --omit=dev > release/sbom.cyclonedx.json
          node --input-type=module - "$RUNNER_TEMP/package.json" <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const [pack]=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const version=JSON.parse(fs.readFileSync('package.json','utf8')).version;
          if(pack.name!=='@chumanic/skillsync'||pack.version!==version||pack.filename!==`chumanic-skillsync-${version}.tgz`) throw new Error('Package identity mismatch');
          const allowed=/^(dist\/|runner\/|profiles\/|templates\/|fixtures\/(behavior|product|runner|policy)\/|config\/|docs\/[^/]+[.]md$|README[.]md$|LICENSE$|CHANGELOG[.]md$|package[.]json$)/;
          if(!pack.files.length||pack.files.some(file=>!allowed.test(file.path)||file.path.split('/').some(part=>part.startsWith('.')&&part!=='.skillsync'))) throw new Error('Unexpected public package file');
          const sbom=JSON.parse(fs.readFileSync('release/sbom.cyclonedx.json','utf8'));
          if(sbom.bomFormat!=='CycloneDX'||!Array.isArray(sbom.components)) throw new Error('Invalid SBOM');
          const sha256=crypto.createHash('sha256').update(fs.readFileSync(`release/${pack.filename}`)).digest('hex');
          fs.writeFileSync('release/release-manifest.json',JSON.stringify({package:pack.name,version,tag:process.env.GITHUB_REF_NAME,source_sha:process.env.GITHUB_SHA,archive:pack.filename,sha256},null,2)+'\n');
          JS
          (cd release && sha256sum *.tgz sbom.cyclonedx.json release-manifest.json > checksums.txt)
      - name: Attest actual package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*.tgz
      - name: Retain verified CLI distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: skillsync-cli
          path: release/*
          if-no-files-found: error

  mac-app:
    needs: release
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Build and inspect owned portable application
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          python3 -m unittest discover -s desktop/tests -p 'test_*.py'
          python3 desktop/prepare_runtime.py --output "$GITHUB_WORKSPACE/.release-workspace/runtime"
          python3 desktop/build_app.py --runtime "$GITHUB_WORKSPACE/.release-workspace/runtime" --output "$GITHUB_WORKSPACE/.release-workspace/apps"
          app="$GITHUB_WORKSPACE/.release-workspace/apps/SkillSync.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/Workspace" --smoke-check "$RUNNER_TEMP/native-smoke.json" --snapshot "$RUNNER_TEMP/native-smoke.png" --width 390
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["success"] is True' "$RUNNER_TEMP/native-smoke.json"
          mkdir release
          version="${GITHUB_REF_NAME#v}"
          archive="release/skillsync-app-v$version-aarch64-apple-darwin.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          python3 desktop/application_manifest.py --application "$app" --archive "$archive" --output "release/skillsync-app-v$version-aarch64-apple-darwin.source.json"
      - name: Attest owned portable application
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: skillsync-mac-app
          path: release/*
          if-no-files-found: error

  publish:
    needs: [release, mac-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: skillsync-*
          path: release
          merge-multiple: true
      - name: Verify immutable tag and publish complete distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type+" "+.object.sha')
          read -r kind source <<< "$ref"
          if [[ "$kind" == tag ]]; then source=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$source" --jq '.object.sha'); fi
          test "$source" = "$GITHUB_SHA"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'An existing release must not be overwritten' >&2; exit 1; fi
          (cd release && sha256sum *.tgz *.zip *.json > checksums.txt)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "SkillSync $GITHUB_REF_NAME" --generate-notes release/*
