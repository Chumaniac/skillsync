schema_version: 2
id: replay-basic
description: Validate a bounded review output through the deterministic Replay backend.
skill_path: skill
agent: codex
execution:
  backend: replay
  replay_trace: events.jsonl
  timeout_ms: 30000
  memory_mb: 512
  cpu_limit: 1
  pids_limit: 64
  network:
    mode: deny
    allowed_hosts: []
  environment:
    allow: []
invariants:
  allowed_writes:
    - workspace/review.md
  required_outputs:
    - workspace/review.md
  forbidden_paths:
    - /Users/**
    - workspace/.secrets/**
  allowed_tools: []
