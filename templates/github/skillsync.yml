name: SkillSync

on:
  pull_request:
    paths:
      - ".agents/skills/**"

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Requires the published @chumanic/skillsync@0.1.1 package.
      - run: npx --yes @chumanic/skillsync@0.1.1 verify --format sarif --path .agents/skills > skillsync.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: skillsync.sarif
